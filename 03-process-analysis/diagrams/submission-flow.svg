<text x="800" y="2480" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="normal" fill="#17324d">Пунктир: загрузка файлов, отправка и результат публикации не проверялись.</text>
