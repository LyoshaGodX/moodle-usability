<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2520" viewBox="0 0 1600 2520" role="img" aria-labelledby="title desc">
<title id="title">Подготовка и сдача работы в Moodle</title>
<desc id="desc">Схема: курс, требования, форум, черновик, выбор вложений, отмена или ожидаемая публикация с повтором при ошибке.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="800.0" y="45" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="43" font-weight="bold" fill="#17324d">Подготовка и сдача работы в Moodle</text>
<text x="800.0" y="102" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="normal" fill="#17324d">Фактический путь до отмены; публикация — ожидаемые этапы</text>
